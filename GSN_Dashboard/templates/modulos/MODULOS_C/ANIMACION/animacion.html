<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSN - Mascota</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent !important;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            background-color: transparent !important;
            background-image: none !important;
        }

        /* ============================================================
           CONTENEDOR PRINCIPAL
           ============================================================ */
        .mascota-container {
            position: fixed;
            bottom: 80px;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            pointer-events: none;
            background: transparent !important;
        }

        /* ============================================================
           MASCOTA - IMAGEN
           ============================================================ */
        .mascota {
            position: relative;
            width: 180px;
            height: 200px;
            pointer-events: auto;
            cursor: pointer;
            transform: translateX(-85%);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent !important;
            filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.3));
        }

        .mascota.visible {
            transform: translateX(0px);
        }

        .mascota.escondido {
            transform: translateX(-85%);
        }

        /* ============================================================
           ANIMACION DE ENTRADA Y SALIDA
           ============================================================ */
        @keyframes entrar {
            0% { transform: translateX(-85%) scale(0.8); opacity: 0; }
            20% { transform: translateX(-10%) scale(1.05); opacity: 1; }
            40% { transform: translateX(5%) scale(1.02); opacity: 1; }
            60% { transform: translateX(0%) scale(1); opacity: 1; }
            100% { transform: translateX(0%) scale(1); opacity: 1; }
        }

        @keyframes salir {
            0% { transform: translateX(0%) scale(1); opacity: 1; }
            30% { transform: translateX(-5%) scale(1.02); opacity: 1; }
            100% { transform: translateX(-85%) scale(0.8); opacity: 0; }
        }

        .mascota.entrando {
            animation: entrar 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .mascota.saliendo {
            animation: salir 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ============================================================
           IMAGEN
           ============================================================ */
        .mascota .imagen-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: transparent !important;
            border-radius: 50% 50% 20px 20px;
        }

        .mascota .imagen-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: inherit;
            background: transparent !important;
        }

        /* ============================================================
           NUBE DE DIÁLOGO - TRANSPARENTE CON LETRAS BLANCAS
           ============================================================ */
        .nube {
            position: absolute;
            top: -70px;
            right: -30px;
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px 20px 4px 20px;
            padding: 12px 18px;
            min-width: 120px;
            max-width: 200px;
            color: #ffffff !important;
            font-size: 13px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.6) translateY(10px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            line-height: 1.4;
            z-index: 10;
        }

        /* Triángulo de la nube - transparente */
        .nube::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 25px;
            width: 16px;
            height: 16px;
            background: rgba(0, 0, 0, 0.45) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0 0 4px 0;
            transform: rotate(45deg);
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Icono en la nube */
        .nube .icono {
            font-size: 16px;
            margin-right: 6px;
        }

        .nube .texto {
            display: inline;
            color: #ffffff !important;
        }

        .nube .texto .highlight {
            color: #12b8a6 !important;
            font-weight: 600;
        }

        /* Nube visible */
        .nube.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Nube oculta */
        .nube.oculta {
            opacity: 0;
            transform: scale(0.6) translateY(10px);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .mascota {
                width: 120px;
                height: 140px;
            }
            .mascota-container {
                bottom: 60px;
            }
            .nube {
                font-size: 11px;
                padding: 10px 14px;
                min-width: 100px;
                max-width: 160px;
                top: -60px;
                right: -20px;
            }
            .nube::after {
                left: 20px;
                width: 12px;
                height: 12px;
                bottom: -8px;
            }
        }

        @media (max-width: 500px) {
            .mascota {
                width: 90px;
                height: 110px;
            }
            .mascota-container {
                bottom: 50px;
            }
            .nube {
                font-size: 10px;
                padding: 8px 12px;
                min-width: 80px;
                max-width: 130px;
                top: -50px;
                right: -15px;
            }
            .nube::after {
                left: 15px;
                width: 10px;
                height: 10px;
                bottom: -6px;
            }
            .nube .icono {
                font-size: 12px;
            }
        }

        @media (min-height: 800px) {
            .mascota {
                width: 200px;
                height: 220px;
            }
            .mascota-container {
                bottom: 100px;
            }
            .nube {
                font-size: 15px;
                padding: 14px 22px;
                min-width: 140px;
                max-width: 240px;
                top: -80px;
                right: -40px;
            }
            .nube::after {
                left: 30px;
                width: 18px;
                height: 18px;
                bottom: -12px;
            }
        }
    </style>
</head>
<body>

    <div class="mascota-container">
        <div class="mascota" id="mascota">
            <!-- Imagen -->
            <div class="imagen-wrapper">
                <img 
                    src="imagen/imagen_1.png" 
                    alt="GSN Mascota"
                    id="mascotaImage"
                    onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22%3E%3Ccircle cx=%22100%22 cy=%22100%22 r=%2290%22 fill=%22none%22 stroke=%22%2312b8a6%22 stroke-width=%222%22/%3E%3Ctext x=%22100%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%2312b8a6%22 font-size=%2440%22 font-family=%22sans-serif%22%3EGSN%3C/text%3E%3C/svg%3E'"
                />
            </div>

            <!-- Nube de diálogo - transparente con letras blancas -->
            <div class="nube oculta" id="nube">
                <span class="icono">👋</span>
                <span class="texto">
                    ¡Bienvenido a <span class="highlight">GSN</span>!
                </span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN - 30 SEGUNDOS
        // ============================================================
        const CONFIG = {
            INTERVALO_APARICION: 30 * 1000, // 30 segundos
            TIEMPO_VISIBLE: 5000, // 5 segundos visible
            TIEMPO_NUBE: 4000, // 4 segundos nube visible
        };

        // ============================================================
        // MENSAJES DE LA NUBE
        // ============================================================
        const MENSAJES_NUBE = [
            { icon: '👋', texto: '¡Bienvenido a <span class="highlight">GSN</span>!' },
            { icon: '📊', texto: 'Datos actualizados' },
            { icon: '📈', texto: 'Todo en orden' },
            { icon: '✅', texto: 'Listo para trabajar' },
            { icon: '🌟', texto: 'Excelente día' },
            { icon: '🚀', texto: '¡Vamos por más!' },
            { icon: '📋', texto: 'Informes listos' },
            { icon: '🎯', texto: '¡Sigue así!' },
            { icon: '💪', texto: '¡Buen trabajo!' },
            { icon: '⭐', texto: 'Eres increíble' },
        ];

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const mascota = document.getElementById('mascota');
        const nube = document.getElementById('nube');

        // ============================================================
        // ESTADO
        // ============================================================
        let estado = {
            visible: false,
            animando: false,
            timerVisible: null,
            timerIntervalo: null,
            timerNube: null,
            primeraVez: true,
        };

        // ============================================================
        // FUNCIONES
        // ============================================================

        /**
         * Obtiene un mensaje aleatorio
         */
        function obtenerMensaje() {
            const idx = Math.floor(Math.random() * MENSAJES_NUBE.length);
            return MENSAJES_NUBE[idx];
        }

        /**
         * Actualiza el contenido de la nube
         */
        function actualizarNube(mensaje) {
            nube.innerHTML = `
                <span class="icono">${mensaje.icon}</span>
                <span class="texto">${mensaje.texto}</span>
            `;
        }

        /**
         * Muestra la nube con un mensaje
         */
        function mostrarNube() {
            const mensaje = obtenerMensaje();
            actualizarNube(mensaje);
            nube.classList.remove('oculta');
            nube.classList.add('visible');

            // Ocultar nube después de un tiempo
            if (estado.timerNube) {
                clearTimeout(estado.timerNube);
            }
            estado.timerNube = setTimeout(() => {
                nube.classList.remove('visible');
                nube.classList.add('oculta');
            }, CONFIG.TIEMPO_NUBE);
        }

        /**
         * Oculta la nube
         */
        function ocultarNube() {
            nube.classList.remove('visible');
            nube.classList.add('oculta');
            if (estado.timerNube) {
                clearTimeout(estado.timerNube);
                estado.timerNube = null;
            }
        }

        /**
         * Muestra la mascota (animación de entrada)
         */
        function mostrarMascota() {
            if (estado.animando) return;

            estado.animando = true;

            // Limpiar timers
            if (estado.timerVisible) {
                clearTimeout(estado.timerVisible);
                estado.timerVisible = null;
            }

            // Remover clases anteriores
            mascota.classList.remove('escondido', 'visible', 'entrando', 'saliendo');

            // Forzar reflow
            void mascota.offsetWidth;

            // Agregar clase de entrada
            mascota.classList.add('entrando');
            estado.visible = true;

            // Después de la animación de entrada, mantener visible
            setTimeout(() => {
                mascota.classList.remove('entrando');
                mascota.classList.add('visible');
                estado.animando = false;

                // Mostrar nube al completar la entrada
                mostrarNube();

                // Programar ocultación después del tiempo visible
                estado.timerVisible = setTimeout(() => {
                    ocultarMascota();
                }, CONFIG.TIEMPO_VISIBLE);

            }, 1200);
        }

        /**
         * Oculta la mascota (animación de salida)
         */
        function ocultarMascota() {
            if (!estado.visible) return;

            if (estado.timerVisible) {
                clearTimeout(estado.timerVisible);
                estado.timerVisible = null;
            }

            ocultarNube();
            estado.animando = true;

            // Remover clases anteriores
            mascota.classList.remove('visible', 'entrando');

            // Forzar reflow
            void mascota.offsetWidth;

            // Agregar clase de salida
            mascota.classList.add('saliendo');
            estado.visible = false;

            // Después de la animación de salida, esconder
            setTimeout(() => {
                mascota.classList.remove('saliendo');
                mascota.classList.add('escondido');
                estado.animando = false;

                // Programar próxima aparición
                programarProximaAparicion();

            }, 1000);
        }

        /**
         * Programa la próxima aparición
         */
        function programarProximaAparicion() {
            if (estado.timerIntervalo) {
                clearTimeout(estado.timerIntervalo);
                estado.timerIntervalo = null;
            }

            estado.timerIntervalo = setTimeout(() => {
                mostrarMascota();
            }, CONFIG.INTERVALO_APARICION);
        }

        /**
         * Maneja el click en la mascota
         */
        function manejarClick() {
            if (estado.visible) {
                // Mostrar nueva nube y reiniciar timer de ocultación
                mostrarNube();
                if (estado.timerVisible) {
                    clearTimeout(estado.timerVisible);
                }
                estado.timerVisible = setTimeout(() => {
                    ocultarMascota();
                }, CONFIG.TIEMPO_VISIBLE);
            } else {
                // Si está oculta, mostrar inmediatamente
                mostrarMascota();
                // Reiniciar el ciclo para que no se solape
                if (estado.timerIntervalo) {
                    clearTimeout(estado.timerIntervalo);
                    estado.timerIntervalo = null;
                }
                // Programar la siguiente aparición después de ocultarse
                setTimeout(() => {
                    programarProximaAparicion();
                }, CONFIG.TIEMPO_VISIBLE + 1200 + 1000 + 100);
            }
        }

        /**
         * Notifica al padre que la mascota está lista
         */
        function notificarListo() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'MASCOTA_READY',
                    source: 'animacion',
                    timestamp: Date.now()
                }, '*');
            }

            try {
                const channel = new BroadcastChannel('gsn_mascota');
                channel.postMessage({
                    type: 'MASCOTA_READY',
                    timestamp: Date.now()
                });
                channel.close();
            } catch (e) {}
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================

        function iniciarMascota() {
            console.log('🤖 Mascota iniciada - Aparece cada 30 segundos');

            // Posicionar inicialmente escondida
            mascota.classList.add('escondido');

            // Programar primera aparición (2 segundos después de cargar)
            setTimeout(() => {
                mostrarMascota();
                notificarListo();
                console.log('🤖 Mascota activa - Aparecerá cada 30 segundos');
            }, 2000);

            // Evento click
            mascota.addEventListener('click', manejarClick);

            // Escuchar mensajes del padre
            window.addEventListener('message', (event) => {
                const data = event.data;
                if (!data || !data.type) return;

                if (data.type === 'MASCOTA_OCULTAR') {
                    ocultarMascota();
                }
                if (data.type === 'MASCOTA_MOSTRAR') {
                    mostrarMascota();
                }
                if (data.type === 'RESET_MASCOTA') {
                    resetearMascota();
                }
                if (data.type === 'MASCOTA_MENSAJE') {
                    if (data.texto) {
                        actualizarNube({ icon: '💬', texto: data.texto });
                        mostrarNube();
                    }
                }
            });
        }

        /**
         * Reinicia la mascota
         */
        function resetearMascota() {
            ocultarMascota();
            if (estado.timerIntervalo) {
                clearTimeout(estado.timerIntervalo);
                estado.timerIntervalo = null;
            }
            setTimeout(() => {
                mostrarMascota();
            }, 1000);
        }

        // ============================================================
        // EXPONER FUNCIONES
        // ============================================================

        window.mascota = {
            mostrar: mostrarMascota,
            ocultar: ocultarMascota,
            resetear: resetearMascota,
            mensaje: (texto) => {
                actualizarNube({ icon: '💬', texto: texto });
                mostrarNube();
            },
            config: CONFIG,
            estado: estado,
        };

        // ============================================================
        // INICIAR
        // ============================================================

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            iniciarMascota();
        } else {
            document.addEventListener('DOMContentLoaded', iniciarMascota);
        }

        console.log('🎯 Mascota GSN lista - Cada 30 segundos');
        console.log('📋 Comandos: mascota.mostrar(), mascota.ocultar(), mascota.mensaje("texto")');
    </script>
</body>
</html>
