
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSN - Actualizador de Datos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f7fa;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .actualizador-container {
            background: rgba(7, 27, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(18, 184, 166, 0.1);
            border-radius: 16px;
            padding: 24px 32px;
            min-width: 320px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .actualizador-container .icono {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .actualizador-container h2 {
            color: #12b8a6;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .actualizador-container .subtitle {
            color: #6a8a9a;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .actualizador-container .estado {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .actualizador-container .estado .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .actualizador-container .estado .dot.sincronizando {
            background: #f4a016;
            box-shadow: 0 0 12px rgba(244, 160, 22, 0.3);
        }

        .actualizador-container .estado .dot.ok {
            background: #50b95a;
            box-shadow: 0 0 12px rgba(80, 185, 90, 0.3);
        }

        .actualizador-container .estado .dot.error {
            background: #e74c3c;
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.3);
        }

        .actualizador-container .estado .dot.pausado {
            background: #6a8a9a;
            box-shadow: 0 0 12px rgba(106, 138, 154, 0.3);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        .actualizador-container .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .actualizador-container .info-item {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px 10px;
        }

        .actualizador-container .info-item .label {
            font-size: 9px;
            text-transform: uppercase;
            color: #4a6a7a;
            letter-spacing: 0.5px;
        }

        .actualizador-container .info-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #f1f7fa;
            margin-top: 2px;
        }

        .actualizador-container .info-item .value.mayoreo { color: #12b8a6; }
        .actualizador-container .info-item .value.fuel { color: #f4a016; }

        .actualizador-container .ultima-act {
            font-size: 10px;
            color: #4a6a7a;
            margin-top: 8px;
        }

        .actualizador-container .ultima-act span {
            color: #6a8a9a;
        }

        .actualizador-container .estado-pausa {
            font-size: 10px;
            color: #a855f7;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        .actualizador-container .estado-pausa.visible {
            display: block;
        }

        @media (max-width: 500px) {
            .actualizador-container {
                padding: 16px 20px;
                min-width: 260px;
            }
            .actualizador-container .icono { font-size: 32px; }
            .actualizador-container h2 { font-size: 15px; }
            .actualizador-container .info-grid { gap: 4px; }
            .actualizador-container .info-item .value { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="actualizador-container">
        <span class="icono">🔄</span>
        <h2>Actualizador de Datos</h2>
        <div class="subtitle">Sincronización automática con Google Sheets</div>

        <div class="estado">
            <span class="dot sincronizando" id="statusDot"></span>
            <span id="statusTexto">Inicializando...</span>
        </div>

        <div class="estado-pausa" id="estadoPausa">
            ⏸️ Actualizaciones pausadas - Asistente activo
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">Mayoreo</div>
                <div class="value mayoreo" id="mayoreoRegistros">0</div>
            </div>
            <div class="info-item">
                <div class="label">Fuel Oil</div>
                <div class="value fuel" id="fuelRegistros">0</div>
            </div>
            <div class="info-item">
                <div class="label">Volumen Mayoreo</div>
                <div class="value mayoreo" id="mayoreoVolumen">0</div>
            </div>
            <div class="info-item">
                <div class="label">Volumen Fuel</div>
                <div class="value fuel" id="fuelVolumen">0</div>
            </div>
        </div>

        <div class="ultima-act">
            Última actualización: <span id="ultimaActualizacion">--:--:--</span>
        </div>
    </div>

    <script>
        // ============================================================
        // ACTUALIZADOR DE DATOS - SOLO LECTURA (NO GUARDA JSON)
        // ============================================================

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const CONFIG = {
            REFRESH_INTERVAL: 30000, // 30 segundos
            SERVER_PORT: 5500,
            FIXED_KEY: 'GSN-DASHBOARD-2026',
            SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwTPkbv-0l9giFB_sXY5wpWdSD7WFsXKuBApFmjHBASBPkCo-m33Poun7EHvpaUKPbWCg/exec',
        };

        const SCRIPT_URL_FUEL = CONFIG.SCRIPT_URL + '?tipo=fuel';

        // ============================================================
        // MAPA DE MESES
        // ============================================================
        const MESES = {
            '01': 'enero', '02': 'febrero', '03': 'marzo', '04': 'abril',
            '05': 'mayo', '06': 'junio', '07': 'julio', '08': 'agosto',
            '09': 'septiembre', '10': 'octubre', '11': 'noviembre', '12': 'diciembre'
        };

        const ORDEN_MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 
                            'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

        function obtenerMesDesdeFecha(fechaStr) {
            if (!fechaStr) return null;
            try {
                if (fechaStr.includes('-')) {
                    const partes = fechaStr.split('-');
                    if (partes.length >= 2) {
                        const mesNum = partes[1];
                        return MESES[mesNum] || null;
                    }
                }
                const d = new Date(fechaStr);
                if (!isNaN(d.getTime())) {
                    const mesNum = String(d.getMonth() + 1).padStart(2, '0');
                    return MESES[mesNum] || null;
                }
            } catch (e) {}
            return null;
        }

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const statusDot = document.getElementById('statusDot');
        const statusTexto = document.getElementById('statusTexto');
        const estadoPausa = document.getElementById('estadoPausa');
        const mayoreoRegistros = document.getElementById('mayoreoRegistros');
        const fuelRegistros = document.getElementById('fuelRegistros');
        const mayoreoVolumen = document.getElementById('mayoreoVolumen');
        const fuelVolumen = document.getElementById('fuelVolumen');
        const ultimaActualizacion = document.getElementById('ultimaActualizacion');

        // ============================================================
        // ESTADO
        // ============================================================
        let DATA_GLOBAL = [];
        let DATA_FUEL_GLOBAL = [];
        let lastUpdateTime = null;
        let lastUpdateFuelTime = null;
        let isSyncing = false;
        let autoRefreshTimer = null;
        let contadorActualizaciones = 0;
        let modulosRegistrados = [];
        let actualizacionesPausadas = false;
        let asistenteActivo = false;

        // ============================================================
        // FUNCIONES DE UI
        // ============================================================

        function setStatus(texto, tipo) {
            statusTexto.textContent = texto;
            statusDot.className = 'dot';
            if (tipo === 'ok') statusDot.classList.add('ok');
            else if (tipo === 'error') statusDot.classList.add('error');
            else if (tipo === 'pausado') statusDot.classList.add('pausado');
            else statusDot.classList.add('sincronizando');
        }

        function actualizarUI() {
            const totalMayoreo = DATA_GLOBAL.length;
            const totalFuel = DATA_FUEL_GLOBAL.length;
            const volMayoreo = DATA_GLOBAL.reduce((sum, item) => sum + (parseFloat(item.despachado) || 0), 0);
            const volFuel = DATA_FUEL_GLOBAL.reduce((sum, item) => sum + (parseFloat(item.volumen) || 0), 0);

            mayoreoRegistros.textContent = totalMayoreo.toLocaleString();
            fuelRegistros.textContent = totalFuel.toLocaleString();
            mayoreoVolumen.textContent = volMayoreo.toLocaleString();
            fuelVolumen.textContent = volFuel.toLocaleString();

            const now = new Date();
            ultimaActualizacion.textContent = now.toLocaleTimeString('es-NI', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // ============================================================
            // SOLO ENVIAR DATOS A MODULOS - NO GUARDAR JSON
            // ============================================================
            enviarDatosAModulos();
        }

        // ============================================================
        // PAUSAR / REANUDAR ACTUALIZACIONES
        // ============================================================
        function pausarActualizaciones() {
            if (actualizacionesPausadas) return;
            actualizacionesPausadas = true;
            asistenteActivo = true;
            setStatus('⏸️ Pausado (Asistente activo)', 'pausado');
            estadoPausa.classList.add('visible');
            console.log('⏸️ Actualizaciones PAUSADAS - Asistente activo');
        }

        function reanudarActualizaciones() {
            if (!actualizacionesPausadas) return;
            actualizacionesPausadas = false;
            asistenteActivo = false;
            setStatus('Reanudando...', 'sincronizando');
            estadoPausa.classList.remove('visible');
            console.log('▶️ Actualizaciones REANUDADAS');
            // Ejecutar una sincronización inmediata al reanudar
            setTimeout(() => syncAll(), 500);
        }

        // ============================================================
        // ORDENAR DATOS ALFABETICAMENTE
        // ============================================================
        function ordenarDatosAlfabeticamente(data, campoPrincipal) {
            if (!data || !Array.isArray(data) || data.length === 0) return data;
            if (!campoPrincipal) {
                const camposPosibles = ['cliente', 'nombre', 'razon_social', 'empresa', 'conductor'];
                for (let i = 0; i < camposPosibles.length; i++) {
                    if (data.some(item => item[camposPosibles[i]] !== undefined && item[camposPosibles[i]] !== null)) {
                        campoPrincipal = camposPosibles[i];
                        break;
                    }
                }
                if (!campoPrincipal) {
                    const keys = Object.keys(data[0] || {});
                    for (let j = 0; j < keys.length; j++) {
                        if (typeof data[0][keys[j]] === 'string') {
                            campoPrincipal = keys[j];
                            break;
                        }
                    }
                    if (!campoPrincipal) campoPrincipal = 'id';
                }
            }
            return data.slice().sort((a, b) => {
                const valA = (a[campoPrincipal] || '').toString().toLowerCase().trim();
                const valB = (b[campoPrincipal] || '').toString().toLowerCase().trim();
                return valA.localeCompare(valB, 'es', { sensitivity: 'base' });
            });
        }

        // ============================================================
        // ENVIAR DATOS A MODULOS (SOLO LECTURA)
        // ============================================================
        function enviarDatosAModulos() {
            const datosCompletos = {
                fuel_oil: {
                    volumen_total: DATA_FUEL_GLOBAL.reduce((s, r) => s + (parseFloat(r.volumen) || 0), 0),
                    margen: DATA_FUEL_GLOBAL.reduce((s, r) => s + (parseFloat(r.margen) || 0), 0),
                    viajes: DATA_FUEL_GLOBAL.length
                },
                general: {
                    volumen_solicitado: DATA_GLOBAL.reduce((s, r) => s + (parseFloat(r.solicitado) || 0), 0),
                    volumen_despachado: DATA_GLOBAL.reduce((s, r) => s + (parseFloat(r.despachado) || 0), 0),
                    margen_bruto_general: DATA_GLOBAL.reduce((s, r) => s + (parseFloat(r.margenBruto) || 0), 0)
                }
            };

            // Enviar a módulos registrados
            modulosRegistrados.forEach(ventana => {
                try {
                    ventana.postMessage({
                        type: 'DATOS_ACTUALIZADOS',
                        data: DATA_GLOBAL,
                        fuelData: DATA_FUEL_GLOBAL,
                        datosResumen: datosCompletos,
                        lastUpdate: lastUpdateTime,
                        lastUpdateFuel: lastUpdateFuelTime,
                        source: 'Google Sheets',
                        pausado: actualizacionesPausadas,
                        soloLectura: true  // Indicador de que NO se deben guardar JSON
                    }, '*');
                } catch (e) {
                    modulosRegistrados = modulosRegistrados.filter(w => w !== ventana);
                }
            });

            // Enviar al padre (main.html)
            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        type: 'DATOS_ACTUALIZADOS',
                        data: DATA_GLOBAL,
                        fuelData: DATA_FUEL_GLOBAL,
                        datosResumen: datosCompletos,
                        lastUpdate: lastUpdateTime,
                        lastUpdateFuel: lastUpdateFuelTime,
                        source: 'Google Sheets',
                        pausado: actualizacionesPausadas,
                        soloLectura: true
                    }, '*');
                } catch (e) {}
            }
        }

        // ============================================================
        // PROCESAR DATOS DE GOOGLE SHEETS - MAYOREO
        // ============================================================
        function rowsToObjects(payload) {
            if (!payload || typeof payload !== 'object') return [];
            if (payload.ok === false) return [];
            if (payload.rows && Array.isArray(payload.rows) && payload.rows.length > 0) {
                if (typeof payload.rows[0] === 'object' && !Array.isArray(payload.rows[0])) return payload.rows;
            }
            if (!payload.headers || !Array.isArray(payload.headers)) return [];
            if (!payload.rows || !Array.isArray(payload.rows)) return [];

            const COLUMN_MAP = {
                'FECHA DE ENTREGA CTE': 'fecha',
                'FECHA DE ENTREGA': 'fecha',
                'FECHA': 'fecha',
                'MES': 'mes',
                'SUB CLIENTE': 'cliente',
                'TIPO DE COMBUSTIBLE': 'combustible',
                'SUB CLIENTE2': 'destino',
                'TIPO DE ENTREGA': 'tipoEntrega',
                'VOLUMEN GLNS SOLICITADO': 'solicitado',
                'VOLUMEN GLNS DESPACHADO': 'despachado',
                'NO PEDIDO PUMA': 'pedidoPuma',
                'NO FACTURA PUMA': 'facturaPuma',
                'RUBRO CLIENTE': 'rubro',
                'COSTO UNITARIO DE COMPRA': 'costoUnitario',
                'COSTO DIRECTO - COMPRA COMBUSTIBLE': 'costoDirecto',
                'CODIGO DE CARGA PUMA': 'codigoCarga',
                'NO PLACA CISTERNA PICK UP': 'cisternaPickup',
                'FLOTA': 'flota',
                'PLACA ENTREGA': 'placaEntrega',
                'DIESEL CISTERNA': 'dieselCisterna',
                'NOMBRE CONDUCTOR': 'conductor',
                'NO REMISION': 'remision',
                'COMISION CONDUCTOR': 'comision',
                'AYUDANTE': 'ayudante',
                'VIATICOS': 'viaticos',
                'CAMBIO DE LLANTAS': 'llantas',
                'EFECTIVO PARA DIESEL DE RETORNO': 'dieselRetorno',
                'IMPREVISTOS': 'imprevistos',
                'COSTOS TOTALES': 'costosTotales',
                'PRECIO DE VENTA': 'precioVenta',
                'SUB TOTAL VENTA': 'subtotalVenta',
                'NO FACTURA GSN': 'facturaGSN',
                'MARGEN BRUTO': 'margenBruto',
                '% MB': 'margenPct',
                'SOBRANTE GALONES': 'sobrante',
                'OBSERVACIONES': 'observaciones'
            };

            const columnIndexMap = {};
            for (let i = 0; i < payload.headers.length; i++) {
                const headerName = payload.headers[i].toUpperCase();
                for (const colName in COLUMN_MAP) {
                    if (headerName === colName.toUpperCase() || headerName === colName) {
                        columnIndexMap[i] = COLUMN_MAP[colName];
                        break;
                    }
                }
            }

            const result = [];
            for (let idx = 0; idx < payload.rows.length; idx++) {
                const row = payload.rows[idx];
                if (typeof row === 'object' && !Array.isArray(row)) { result.push(row); continue; }
                if (!Array.isArray(row)) continue;

                const obj = {};
                let hasFecha = false;

                for (const colIdx in columnIndexMap) {
                    const fieldName = columnIndexMap[colIdx];
                    const i = parseInt(colIdx);
                    if (i >= row.length) continue;
                    let val = row[i];

                    if (val === '' || val === null || val === undefined) {
                        obj[fieldName] = null;
                    } else if (typeof val === 'number') {
                        obj[fieldName] = val;
                    } else if (val instanceof Date) {
                        const year = val.getFullYear();
                        if (year >= 1900 && year <= 2100) {
                            obj[fieldName] = val.toISOString().replace('T', ' ').slice(0, 19);
                            if (fieldName === 'fecha') hasFecha = true;
                        } else { obj[fieldName] = null; }
                    } else if (typeof val === 'string') {
                        const trimmed = val.trim();
                        if (fieldName === 'fecha') {
                            const match = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
                            if (match) {
                                const year = parseInt(match[1]);
                                if (year >= 1900 && year <= 2100) { obj[fieldName] = trimmed;
                                    hasFecha = true; continue; }
                            }
                            const d = new Date(trimmed);
                            if (!isNaN(d.getTime())) {
                                const year = d.getFullYear();
                                if (year >= 1900 && year <= 2100) { obj[fieldName] = trimmed;
                                    hasFecha = true; continue; }
                            }
                            obj[fieldName] = null;
                        } else if (trimmed !== '' && !isNaN(trimmed) && trimmed.match(/^[\d,.\-]+$/)) {
                            obj[fieldName] = parseFloat(trimmed.replace(/,/g, ''));
                        } else {
                            obj[fieldName] = trimmed;
                        }
                    } else if (typeof val === 'boolean') {
                        obj[fieldName] = val;
                    } else {
                        obj[fieldName] = String(val).trim();
                    }
                }

                if (!hasFecha && obj.fecha) hasFecha = true;
                if (hasFecha || obj.cliente || obj.pedidoPuma) {
                    obj.id = result.length + 1;
                    result.push(obj);
                }
            }
            return result;
        }

        // ============================================================
        // PROCESAR DATOS DE GOOGLE SHEETS - FUEL OIL
        // ============================================================
        function rowsToObjectsFuel(payload) {
            if (!payload || typeof payload !== 'object') return [];
            if (payload.ok === false) return [];
            if (payload.rows && Array.isArray(payload.rows) && payload.rows.length > 0) {
                if (typeof payload.rows[0] === 'object' && !Array.isArray(payload.rows[0])) return payload.rows;
            }
            if (!payload.headers || !Array.isArray(payload.headers)) return [];
            if (!payload.rows || !Array.isArray(payload.rows)) return [];

            const COLUMN_MAP_FUEL = {
                'FECHA': 'fecha',
                'MES': 'mes',
                'CONDUCTOR': 'conductor',
                'PLACA CISTERNA': 'placaCisterna',
                'PRODUCTO': 'producto',
                'VOLUMEN': 'volumen',
                'COSTO PUMA': 'costoPuma',
                'SUB TOTAL COSTO': 'subTotalCosto',
                'SUB TOTAL VENTA': 'subTotalVenta',
                'MARGEN': 'margen',
                'NO. DE CARGA': 'noCarga',
                'PEDIDO': 'pedido',
                'FACTURA': 'factura'
            };

            const columnIndexMap = {};
            for (let i = 0; i < payload.headers.length; i++) {
                const headerName = payload.headers[i].toUpperCase().trim();
                for (const colName in COLUMN_MAP_FUEL) {
                    if (headerName === colName.toUpperCase() || headerName === colName || headerName.includes(colName.toUpperCase())) {
                        columnIndexMap[i] = COLUMN_MAP_FUEL[colName];
                        break;
                    }
                }
            }

            const result = [];
            for (let idx = 0; idx < payload.rows.length; idx++) {
                const row = payload.rows[idx];
                if (typeof row === 'object' && !Array.isArray(row)) { result.push(row); continue; }
                if (!Array.isArray(row)) continue;

                let hasData = false;
                for (let k = 0; k < Math.min(row.length, 5); k++) {
                    if (row[k] !== '' && row[k] !== null && row[k] !== undefined) { hasData = true; break; }
                }
                if (!hasData) continue;

                const obj = {};
                let hasFecha = false;

                for (const colIdx in columnIndexMap) {
                    const fieldName = columnIndexMap[colIdx];
                    const i = parseInt(colIdx);
                    if (i >= row.length) continue;
                    let val = row[i];

                    if (val === '' || val === null || val === undefined) {
                        obj[fieldName] = null;
                    } else if (typeof val === 'number') {
                        obj[fieldName] = val;
                        if (fieldName === 'fecha' && val > 0) {
                            const date = new Date((val - 25569) * 86400 * 1000);
                            if (!isNaN(date.getTime())) {
                                const year = date.getFullYear();
                                if (year >= 1900 && year <= 2100) {
                                    obj[fieldName] = date.toISOString().split('T')[0];
                                    hasFecha = true;
                                }
                            }
                        }
                    } else if (val instanceof Date) {
                        const year = val.getFullYear();
                        if (year >= 1900 && year <= 2100) {
                            obj[fieldName] = val.toISOString().split('T')[0];
                            if (fieldName === 'fecha') hasFecha = true;
                        } else { obj[fieldName] = null; }
                    } else if (typeof val === 'string') {
                        const trimmed = val.trim();
                        if (fieldName === 'fecha') {
                            const match = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
                            if (match) {
                                const year = parseInt(match[1]);
                                if (year >= 1900 && year <= 2100) { obj[fieldName] = trimmed;
                                    hasFecha = true; continue; }
                            }
                            const d = new Date(trimmed);
                            if (!isNaN(d.getTime())) {
                                const year = d.getFullYear();
                                if (year >= 1900 && year <= 2100) {
                                    obj[fieldName] = d.toISOString().split('T')[0];
                                    hasFecha = true;
                                    continue;
                                }
                            }
                            obj[fieldName] = null;
                        } else if (trimmed !== '' && !isNaN(trimmed) && trimmed.match(/^[\d,.\-]+$/)) {
                            obj[fieldName] = parseFloat(trimmed.replace(/,/g, ''));
                        } else {
                            obj[fieldName] = trimmed;
                        }
                    } else if (typeof val === 'boolean') {
                        obj[fieldName] = val;
                    } else {
                        obj[fieldName] = String(val).trim();
                    }
                }

                if (hasFecha || obj.conductor || obj.placaCisterna || obj.producto) {
                    obj.id = result.length + 1;
                    result.push(obj);
                }
            }
            return result;
        }

        // ============================================================
        // SINCRONIZAR DATOS - SOLO LECTURA (NO GUARDA JSON)
        // ============================================================
        async function syncMayoreo() {
            try {
                const url = CONFIG.SCRIPT_URL + '?key=' + encodeURIComponent(CONFIG.FIXED_KEY);
                const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });

                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || data.ok === false) throw new Error(data?.error || 'Respuesta no valida');

                const freshData = rowsToObjects(data);
                if (!freshData || freshData.length === 0) throw new Error('No se recibieron registros');

                DATA_GLOBAL = freshData;
                lastUpdateTime = data.updatedAt ? new Date(data.updatedAt) : new Date();
                return true;

            } catch (error) {
                console.error('Error sincronizando Mayoreo:', error.message);
                return false;
            }
        }

        async function syncFuel() {
            try {
                const url = SCRIPT_URL_FUEL + '&key=' + encodeURIComponent(CONFIG.FIXED_KEY);
                const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });

                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!data || data.ok === false) throw new Error(data?.error || 'Respuesta no valida');

                const freshData = rowsToObjectsFuel(data);
                DATA_FUEL_GLOBAL = freshData || [];
                lastUpdateFuelTime = data.updatedAt ? new Date(data.updatedAt) : new Date();
                return true;

            } catch (error) {
                console.error('Error sincronizando Fuel Oil:', error.message);
                return false;
            }
        }

        async function syncAll() {
            // NO sincronizar si está pausado
            if (actualizacionesPausadas) {
                console.log('⏸️ Sincronización saltada - Actualizaciones pausadas');
                return;
            }

            if (isSyncing) return;
            isSyncing = true;
            setStatus('Sincronizando...', 'sincronizando');

            try {
                const mayoreoOk = await syncMayoreo();
                const fuelOk = await syncFuel();

                if (mayoreoOk && fuelOk) {
                    setStatus('Sincronizado ✓', 'ok');
                    actualizarUI();
                    contadorActualizaciones++;
                    console.log(`🔄 Sincronización #${contadorActualizaciones} completada - Mayoreo: ${DATA_GLOBAL.length}, Fuel: ${DATA_FUEL_GLOBAL.length}`);
                } else {
                    setStatus('Error en sincronización', 'error');
                }
            } catch (error) {
                setStatus('Error: ' + error.message, 'error');
            }

            isSyncing = false;
        }

        // ============================================================
        // ESCUCHAR MENSAJES DEL ASISTENTE (main.html)
        // ============================================================
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || !data.type) return;

            console.log('📨 Actualizador recibió:', data.type);

            switch (data.type) {
                case 'ASISTENTE_OPEN':
                    // El asistente se abrió - PAUSAR actualizaciones
                    pausarActualizaciones();
                    break;

                case 'ASISTENTE_CLOSE':
                    // El asistente se cerró - REANUDAR actualizaciones
                    reanudarActualizaciones();
                    break;

                case 'REGISTRAR_MODULO':
                    const origen = event.source;
                    if (origen && !modulosRegistrados.includes(origen)) {
                        modulosRegistrados.push(origen);
                        console.log('📦 Módulo registrado:', data.nombre || 'desconocido');
                        enviarDatosAModulos();
                    }
                    break;

                case 'SOLICITAR_DATOS':
                    if (event.source) {
                        event.source.postMessage({
                            type: 'DATOS_RESPONSE',
                            data: DATA_GLOBAL,
                            fuelData: DATA_FUEL_GLOBAL,
                            lastUpdate: lastUpdateTime,
                            lastUpdateFuel: lastUpdateFuelTime,
                            pausado: actualizacionesPausadas,
                            soloLectura: true
                        }, '*');
                    }
                    break;

                default:
                    break;
            }
        });

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================

        function iniciarActualizador() {
            setStatus('Inicializando...', 'sincronizando');

            // Notificar al padre que estamos listos
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'ACTUALIZADOR_READY',
                    source: 'actualizador',
                    timestamp: Date.now(),
                    soloLectura: true
                }, '*');
            }

            setTimeout(() => {
                syncAll();

                if (autoRefreshTimer) clearInterval(autoRefreshTimer);
                autoRefreshTimer = setInterval(() => {
                    syncAll();
                }, CONFIG.REFRESH_INTERVAL);

                console.log('🔄 Actualizador iniciado - SOLO LECTURA');
                console.log(`📊 Actualizando cada ${CONFIG.REFRESH_INTERVAL / 1000} segundos`);
                console.log('⏸️ Las actualizaciones se PAUSAN cuando el asistente está activo');
                console.log('📁 NO se guardan archivos JSON (solo lectura)');
            }, 500);
        }

        // ============================================================
        // INICIAR
        // ============================================================

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            iniciarActualizador();
        } else {
            document.addEventListener('DOMContentLoaded', iniciarActualizador);
        }

        console.log('🔄 Actualizador de Datos GSN - MODO SOLO LECTURA');
        console.log('📁 NO se guardan archivos JSON');
        console.log('⏸️ El asistente controla la pausa de actualizaciones');
    </script>
</body>
</html>
