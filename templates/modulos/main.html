<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Control de Distribución · Grupo GSN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="shell" id="dashboardContent">
        
        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="status-left">
                <span class="dot orange"></span>
                <span class="status-label orange">Fuel Oil</span>
                <span class="status-divider">|</span>
                <span class="status-time" id="statusFuelTime">--:--:--</span>
                <span class="status-divider">|</span>
                <span class="status-update" id="statusFuelDate">--/--/----</span>
                <span class="status-divider">|</span>
                <span class="status-volumen" id="statusFuelVolumen">0</span>
                <span class="status-divider">|</span>
                <span class="status-update" id="statusFuelRegistros">0</span>
            </div>

            <div class="status-center">
                <span class="brand-small">G<span>SN</span></span>
                <span class="version-small">v3.0</span>
                <span class="status-sync">
                    <span class="sync-icon" id="syncIcon">↻</span>
                    <span id="syncStatus">Sincronizado</span>
                </span>
            </div>

            <div class="status-right">
                <span class="dot green"></span>
                <span class="status-label teal">Mayoreo</span>
                <span class="status-divider">|</span>
                <span class="status-time" id="statusMayoreoTime">--:--:--</span>
                <span class="status-divider">|</span>
                <span class="status-update" id="statusMayoreoDate">--/--/----</span>
                <span class="status-divider">|</span>
                <span class="status-volumen" id="statusMayoreoVolumen">0</span>
                <span class="status-divider">|</span>
                <span class="status-update" id="statusMayoreoRegistros">0</span>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="frame-loader" id="frameLoader">
                <div class="loader-orb"></div>
                <div class="loader-ring"></div>
                <div class="loader-text">Cargando módulo...</div>
            </div>
            <iframe id="moduloFrame" src="MODULOS_C/DASHBOARD/resumen_ejecutivo.html"></iframe>
            <iframe id="asistenteFrame" src="MODULOS_C/ASISTENTE/asistente.html"></iframe>
        </div>

        <!-- BOTTOM MENU - BOTONES EMPRESARIALES SVG -->
        <nav class="bottom-menu" id="bottomMenu">
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>
            <div class="burbuja"></div>

            <div class="menu-items">
                <button class="menu-item active" data-view="summary" title="Resumen Ejecutivo">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                            <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                            <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                            <rect x="3" y="16" width="7" height="5" rx="1.5"/>
                        </svg>
                    </span>
                    <span class="label">Resumen</span>
                </button>

                <button class="menu-item" data-view="volumes" title="Volúmenes">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 8V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/>
                            <path d="M1 4h22v4H1z"/>
                            <path d="M10 12h4"/>
                        </svg>
                    </span>
                    <span class="label">Volúmenes</span>
                </button>

                <button class="menu-item" data-view="profit" title="Rentabilidad">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1v22"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </span>
                    <span class="label">Rentabilidad</span>
                </button>

                <button class="menu-item" data-view="deliveries" title="Entregas">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 3h15v13H1z"/>
                            <path d="M16 8h4l3 3v5h-7z"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                    </span>
                    <span class="label">Entregas</span>
                </button>

                <button class="menu-item" data-view="fleet" title="Flota y Rutas">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 17h4V5H2v12h3"/>
                            <path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/>
                            <circle cx="7.5" cy="17.5" r="2.5"/>
                            <circle cx="17.5" cy="17.5" r="2.5"/>
                        </svg>
                    </span>
                    <span class="label">Flota</span>
                </button>

                <button class="menu-item fuel-item" data-view="fuel" title="Fuel Oil">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 22h12V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/>
                            <path d="M15 8h2a3 3 0 0 1 3 3v3a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 3"/>
                            <path d="M6 8h6"/>
                        </svg>
                    </span>
                    <span class="label">Fuel Oil</span>
                </button>

                <button class="menu-item location-item" data-view="location" title="Ubicación">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </span>
                    <span class="label">Ubicación</span>
                </button>

                <span class="menu-divider"></span>

                <button class="menu-item ia-item" id="openAssistantMenu" title="Asistente AI">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2"/>
                            <circle cx="12" cy="5" r="2"/>
                            <path d="M12 7v4"/>
                            <line x1="8" y1="16" x2="8" y2="16"/>
                            <line x1="16" y1="16" x2="16" y2="16"/>
                        </svg>
                    </span>
                    <span class="label">IA</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- ANIMACIÓN FLOTANTE -->
    <div id="animacionContainer">
        <iframe src="MODULOS_C/ANIMACION/animacion.html" id="animacionFrame"></iframe>
    </div>

    <!-- ACTUALIZADOR DE DATOS (OCULTO) -->
    <iframe id="actualizadorFrame" src="MODULOS_C/ACTUALIZADOR/actualizador.html"></iframe>

    <script src="js/main.js"></script>
</body>
</html>
