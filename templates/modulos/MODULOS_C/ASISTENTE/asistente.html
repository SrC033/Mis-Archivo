<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
    <title>Asistente ALFA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="assistant-body">

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="assistant-wrapper">

        <!-- DIÁLOGO -->
        <div class="cloud-dialog" id="cloudDialog">
            <div class="dialog-glow-line"></div>
            <div class="dialog-caret"></div>

            <div class="dialog-header">
                <div class="dialog-header-left">
                    <span class="dialog-status-dot" id="dialogStatusDot"></span>
                    <span class="dialog-title">ASISTENTE ALFA</span>
                </div>
                <div class="dialog-header-right">
                    <span class="dialog-badge" id="dialogBadge">OFFLINE</span>
                </div>
            </div>

            <div class="dialog-history" id="dialogHistory">
                <div class="dialog-message welcome">
                    <svg class="welcome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Haz clic en el logo para comenzar</span>
                </div>
            </div>
        </div>

        <!-- LOGO CON VIDEO -->
        <div class="logo-g-float" id="logoG">
            <div class="logo-body" id="logoBody">
                <video id="logoVideo" src="imagen/video_1.mp4" autoplay loop muted playsinline poster="imagen/video_1.mp4">
                    Tu navegador no soporta videos.
                </video>
                <div class="logo-overlay"></div>
                <div class="logo-scanline"></div>
                <div class="connection-status offline" id="connectionStatus" title="Conectando al servidor..."></div>
            </div>

            <div class="input-bar" id="inputBar">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <input type="text" id="inputTexto" placeholder="Escribe tu mensaje..." />
                <button class="btn-send" id="btnSend" title="Enviar" aria-label="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>

            <div class="logo-buttons">
                <button class="btn-icon" id="micBtn" title="Activar micrófono" aria-label="Micrófono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <span class="tooltip">Micrófono</span>
                </button>

                <button class="btn-icon" id="clearBtn" title="Limpiar chat" aria-label="Limpiar chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                    <span class="tooltip">Limpiar</span>
                </button>

                <button class="btn-icon active" id="audioBtn" title="Voz activa" aria-label="Audio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <span class="tooltip">Audio</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
